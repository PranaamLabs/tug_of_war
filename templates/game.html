<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    >

    <title>Tug of War - Team {{ team|title }}</title>

    <style>

        /* ==========================================
           PAGE
           ========================================== */

        :root {
            --bg-color: #e6f2ff;
            --team-color: #3399ff;
            --team-shadow: #0066cc;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;

            margin: 0;
            padding: 0;

            background-color: var(--bg-color);

            display: flex;
            flex-direction: column;

            height: 100vh;
            overflow: hidden;

            user-select: none;
            -webkit-user-select: none;
        }


        /* ==========================================
           HEADER
           ========================================== */

        #header {
            padding: 20px;

            text-align: center;

            font-size: 1.5rem;
            font-weight: bold;

            color: #333;
        }

        #status-display {
            margin-top: 10px;

            font-size: 1.2rem;
            font-weight: normal;

            min-height: 1.5em;
        }


        /* ==========================================
           GAME AREA
           ========================================== */

        #game-area {
            flex: 1;

            display: flex;
            flex-direction: column;

            justify-content: center;
            align-items: center;

            width: 100%;
        }


        /* ==========================================
           ARENA
           ========================================== */

        #arena {
            position: relative;

            width: 90%;
            height: 100px;

            margin-bottom: 10vh;
        }


        /*
         * The actual rope track.
         */

        #rope-container {
            position: absolute;

            left: 0;
            right: 0;

            top: 50%;

            transform: translateY(-50%);

            height: 60px;

            background-color: white;

            border: 4px solid #333;
            border-radius: 30px;

            overflow: hidden;

            box-shadow:
                inset 0 5px 10px rgba(0, 0, 0, 0.1);
        }


        /* ==========================================
           WIN LINES
           ========================================== */

        .win-line {
            position: absolute;

            top: 0;
            bottom: 0;

            width: 5px;

            z-index: 20;

            border-radius: 5px;
        }

        #red-win-line {
            left: 10%;

            background-color: #cc0000;
        }

        #blue-win-line {
            right: 10%;

            background-color: #0066cc;
        }


        /* ==========================================
           CENTRE LINE
           ========================================== */

        #center-line {
            position: absolute;

            top: 0;
            bottom: 0;

            left: 50%;

            width: 4px;

            background-color: rgba(0, 0, 0, 0.5);

            transform: translateX(-50%);

            z-index: 20;
        }


        /* ==========================================
           ROPE
           ========================================== */

        #rope {
            position: absolute;

            width: 200%;
            height: 100%;

            left: -50%;

            background:
                repeating-linear-gradient(
                    45deg,
                    #d4a373,
                    #d4a373 10px,
                    #ccd5ae 10px,
                    #ccd5ae 20px
                );

            transition: transform 0.1s linear;

            z-index: 5;
        }

        #position-display {
            position: absolute;
            top: 10px;
            width: 100%;
            text-align: center;
            font-weight: bold;
            font-size: 1.2rem;
            color: #333;
            z-index: 30;
        }

        #rope-knot {
            position: absolute;
            left: 50%; /* Centers the knot exactly in the middle of the rope */
            top: 50%;
            transform: translate(-50%, -50%);
            width: 25px;
            height: 40px;
            background-color: #8b4513; /* Dark brown knot color */
            border: 3px solid #333;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }


        /* ==========================================
           TEAM LABELS
           ========================================== */

        .team-label {
            position: absolute;

            top: -35px;

            font-weight: bold;
            font-size: 1rem;

            z-index: 30;
        }

        #red-label {
            left: 5%;

            color: #cc0000;
        }

        #blue-label {
            right: 5%;

            color: #0066cc;
        }


        /* ==========================================
           TAP BUTTON
           ========================================== */

        #tap-button {
            width: 80%;
            max-width: 400px;

            height: 250px;

            font-size: 4rem;
            font-weight: 900;

            color: white;

            background-color: var(--team-color);

            border: none;
            border-radius: 40px;

            box-shadow:
                0 12px 0 var(--team-shadow),
                0 20px 25px rgba(0, 0, 0, 0.3);

            cursor: pointer;

            user-select: none;
            -webkit-user-select: none;

            -webkit-tap-highlight-color: transparent;
        }


        #tap-button:active:not(:disabled) {
            transform: translateY(12px);

            box-shadow:
                0 0 0 transparent,
                0 5px 10px rgba(0, 0, 0, 0.3);
        }


        #tap-button:disabled {
            background-color: #999;

            box-shadow:
                0 12px 0 #666;

            cursor: not-allowed;

            opacity: 0.8;
        }

    </style>
</head>


<body
    style="
        --bg-color: {{ '#ffe6e6' if team == 'red' else '#e6f2ff' }};
        --team-color: {{ '#ff4d4d' if team == 'red' else '#3399ff' }};
        --team-shadow: {{ '#cc0000' if team == 'red' else '#0066cc' }};
    "
>
    <div id="header">

        <div>
            Room: {{ room_id }}
            |
            Team {{ team | title }}
        </div>

        <div id="status-display">
            Waiting for server...
        </div>

    </div>
    <div id="game-area">

        <div id="arena">

            <div id="position-display">Position: 0</div>

            <div id="rope-container">

                <!-- Winning boundaries -->
                <div id="red-win-line" class="win-line"></div>

                <div id="blue-win-line" class="win-line"></div>

                <!-- Centre -->
                <div id="center-line"></div>

                <!-- Rope -->
                <div id="rope">
                    <div id="rope-knot"></div>
                </div>
                
            </div>

        </div>


        <!-- Main player button -->

        <button
            id="tap-button"
            disabled
        >
            TAP!
        </button>

    </div>
    <script src="/static/js/player.js"></script>
</body>
</html>
